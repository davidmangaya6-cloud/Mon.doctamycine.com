<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--c1:#121212;--c2:#1e1e1e;--tx:#f5f5f5;--mu:#8e8e93;--g:linear-gradient(135deg,#ff3d81,#ff8a3d 55%,#ffd23d);--pk:#ff3d81;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box;margin:0;-webkit-tap-hi  n,w cxghlight-color:transparent}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}

#app{max-width:520px;margin:0 auto;padding:0 0 96px}

.chip.on{background:#fff;color:#000}
.post{border-bottom:1px solid var(--c2);padding-bottom:14px;margin-bottom:6px}

.price{font-weight:700;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:18px}
.vis{position:relative;aspect-ratio:1;background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden;user-select:none}

.h2{font-size:22px;padding:18px 16px 6px}

.row div.i{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{font:800 30px 'Syne',sans-serif;width:34px;text-align:center;color:#3a3a3a}
.first{border-color:#ffd23d66;box-shadow:0 0 40px #ff8a3d33}.first .rk{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar{height:5px;border-radius:9px;background:var(--c2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.mini{background:var(--c2);padding:8px 12px;border-radius:10px;font-weight:700}
.form{margin:12px 16px;padding:16px;background:var(--c1);border:1px solid var(--c2);border-radius:20px;display:grid;gap:10px}
.form input,.form select,.form textarea{background:#000;border:1px solid #2a2a2a;border-radius:12px;padding:11px 12px;width:100%}
.form label{color:var(--mu);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 16px}

.tabs{display:flex;gap:8px;margin:0 16px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#000d;backdrop-filter:blur(14px);border-top:1px solid var(--c2);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:520px;margin:0 auto;display:flex}
.nav button{flex:1;padding:10px 0 9px;color:var(--mu);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px;position:relative}
.nav button span{font-size:22px;filter:grayscale(1)}.nav .on{color:#fff}.nav .on span{filter:none}
.nav em{position:absolute;top:4px;left:55%;background:var(--pk);color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px}
.tot{display:flex;justify-content:space-between;font:800 24px 'Syne',sans-serif;padding:8px 16px}
.go{display:block;width:calc(100% - 32px);margin:8px 16px;background:var(--g);color:#000;font-weight:700;padding:15px;border-radius:16px;font-size:16px}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--c2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#fff;color:#000;font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes bob{50%{translate:0 -12px;rotate:4deg}}
.vis{perspective:700px}
.vis::before{content:'';position:absolute;left:15%;width:70%;height:20%;bottom:8%;border-radius:50%;background:radial-gradient(#000a,transparent 70%);filter:blur(6px)}
.vis::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),#ffffff3d,transparent 50%);pointer-events:none}
.vis span{position:relative;z-index:1;transform:translateZ(60px) rotateY(calc(var(--rx,0)*1deg)) rotateX(calc(var(--ry,0)*-1deg));transition:transform .15s}
.post{perspective:900px}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
.ring{background:conic-gradient(from var(--a),#ff3d81,#ff8a3d,#ffd23d,#ff3d81);animation:spin 4s linear infinite}
.wc{transition:transform .2s}
.live{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translate(-50%,-20px);background:#1e1e1ee6;backdrop-filter:blur(10px);border:1px solid #ffffff22;padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.4s;z-index:20;max-width:92vw;text-align:center;pointer-events:none}.live.show{opacity:1;transform:translate(-50%,0)}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px #ffffff1f,0 0 16px #7c4dff33}50%{box-shadow:0 0 0 1px #ff8a3d66,0 0 30px #ff3d8140}}
@keyframes sweep{from{background-position:0 0,150% 0}to{background-position:0 0,-50% 0}}
.post .vis{margin:0 12px;border-radius:22px;animation:glow 5s ease-in-out infinite}
.post .vis::after{background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),#ffffff3d,transparent 50%),linear-gradient(115deg,transparent 42%,#ffffff1c 50%,transparent 58%);background-size:auto,250% 100%;animation:sweep 6s linear infinite}
.first .vis{box-shadow:0 0 0 1px #ffd23d88,0 0 18px #ffd23d44}
#wsub,.wf{display:none}
#wt{filter:drop-shadow(0 0 26px #ff3d8160)}
.enter{margin-top:34px}
a.mini{color:var(--tx);text-decoration:none}
[hidden]{display:none!important}
.frame{position:relative;margin:4px 12px 0;padding:9px;border-radius:28px;background:linear-gradient(145deg,#1c1c1c,#080808);box-shadow:0 0 0 1px color-mix(in srgb,var(--sc,#ff8a3d) 45%,transparent),0 0 26px color-mix(in srgb,var(--sc,#ff8a3d) 28%,transparent);animation:glow2 5s ease-in-out infinite}
.frame .vis{margin:0;border-radius:20px;animation:none}
.cn{position:absolute;width:26px;height:26px;border:3px solid var(--sc,#ff8a3d);z-index:3;pointer-events:none}
.tl{top:3px;left:3px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}.tr{top:3px;right:3px;border-left:0;border-bottom:0;border-radius:0 18px 0 0}.bl{bottom:3px;left:3px;border-right:0;border-top:0;border-radius:0 0 0 18px}.br{bottom:3px;right:3px;border-left:0;border-top:0;border-radius:0 0 18px 0}
.fa{position:absolute;z-index:4;width:40px;height:40px;border-radius:50%;background:#000a;backdrop-filter:blur(6px);border:1px solid #ffffff30;display:grid;place-items:center;font-size:18px;transition:transform .15s,background .15s}.fa:active{transform:scale(1.3);background:var(--sc,#ff8a3d)}.fa.on{color:var(--pk)}
.rc{display:block;width:calc(100% - 32px);margin:10px 16px;padding:18px;border-radius:20px;text-align:left;background:var(--c1);border:1px solid var(--c2);transition:.2s}.rc b{font:800 20px 'Syne',sans-serif;display:block}.rc span{color:var(--mu);font-size:13px}.rc:active{transform:scale(.97);border-color:#ff8a3d}
.ban{margin:10px 16px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,#ff3d8133,#ffd23d22);font-weight:500}
.vf{color:#4da3ff}
.modal{position:fixed;inset:0;z-index:40;background:#000c;backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;opacity:0;animation:fin .25s forwards}
.mc{position:relative;width:min(460px,100%);max-height:92vh;overflow:auto;background:#0d0d0d;border-radius:26px;padding:14px;border:1px solid #ffffff22}.mc h2{margin:12px 0 4px}
.logo{filter:drop-shadow(0 0 10px #ff3d8199)}
.row,.form,.stats div{border-color:#00f0ff33;box-shadow:0 0 0 1px #00f0ff14,0 0 22px #ff2bd60f}
.chip.on{box-shadow:0 0 16px #00f0ff88}
.nav{border-top-color:#00f0ff44;box-shadow:0 -6px 30px #ff2bd622}.nav .on{text-shadow:0 0 12px #00f0ff}
.top{border-bottom:1px solid #ff2bd644;box-shadow:0 8px 24px #00f0ff0f}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40vmax 30vmax at 0% 0%,#ff2bd61f,transparent),radial-gradient(40vmax 30vmax at 100% 100%,#00f0ff1a,transparent)}
.go,.buy{box-shadow:0 0 22px #ff3d8155}.mini{border:1px solid #00f0ff44}.h2{text-shadow:0 0 14px #00f0ff55}
.tabs{overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.tabs .chip{white-space:nowrap}
.fls{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.fch{flex:none;display:flex;align-items:center;gap:6px;padding:4px 12px 4px 10px;border-radius:99px;background:var(--c1);border:1px solid #00f0ff55;box-shadow:0 0 14px #00f0ff22;font-size:12px;color:#cfcfcf}.fch .av{width:26px;height:26px;font-size:13px;border:0}.fch::before{content:'';width:7px;height:7px;border-radius:50%;background:#00f0ff;box-shadow:0 0 8px #00f0ff;animation:pl2 1.6s infinite}
@keyframes pl2{50%{opacity:.25}}
.cin select,.srt{background:#000;border:1px solid #2a2a2a;border-radius:10px;padding:6px;max-width:120px}
.cbox{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto;margin:10px 0}.mg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--c2);align-self:flex-start}.mg.c{align-self:flex-end;background:#00f0ff22;border:1px solid #00f0ff55}
.rib{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 66px);z-index:7;font-size:11px;padding:3px 10px;border-radius:99px;background:#000c;border:1px solid #00f0ff66;color:#00f0ff;pointer-events:none}.rib:empty{display:none}
body[data-ft~=offers] [data-a=offer],body[data-ft~=chat] [data-a=chat]{display:none}body[data-ft~=flash] .fls{display:none}
body:is([data-r=marchand],[data-r=admin]) .post :is(.fa,.acts,.stars,.cin,.bz .mini){display:none}
@keyframes glow2{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 30%,transparent),0 0 16px color-mix(in srgb,var(--sc) 25%,transparent)}50%{box-shadow:0 0 0 1px color-mix(in srgb,var(--sc) 70%,transparent),0 0 32px color-mix(in srgb,var(--sc) 45%,transparent)}}
.post .vis{animation:glow2 5s ease-in-out infinite}
.bz{padding:4px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}.bz>span{font-size:13px;white-space:nowrap}.bz .bar{flex:1;min-width:70px;margin:0}.bf{transition:width 1s}
.stars{display:flex;align-items:center;gap:2px;padding:2px 16px}.stars button{font-size:19px;color:#3a3a3a}.stars button.on{color:#ffd23d}.stars span{margin-left:6px;font-size:13px}
.cimg{display:block;width:90px;height:90px;object-fit:cover;border-radius:12px;margin-top:6px}
.promo{margin:0 12px 8px;padding:7px 12px;border-radius:12px;background:linear-gradient(90deg,#ff3d8133,#ffd23d22);font-size:13px;display:flex;justify-content:space-between;animation:glow 3s ease-in-out infinite}
/* Bienvenue */
#welcome{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;text-align:center;overflow:hidden;clip-path:circle(150% at 50% 85%)}
#welcome.out{animation:iris .9s cubic-bezier(.7,0,.3,1) forwards}
@keyframes iris{to{clip-path:circle(0% at 50% 85%)}}
#fx{position:absolute;inset:0}
.orb{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.38;animation:drift 14s ease-in-out infinite alternate}
.o1{background:#ff3d81;left:-25vmax;top:-20vmax}.o2{background:#7c4dff;right:-25vmax;bottom:-15vmax;animation-delay:-6s}.o3{background:#ff8a3d;width:30vmax;height:30vmax;left:40%;top:55%;opacity:.25;animation-delay:-3s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.wc{position:relative;padding:24px}
#wt{font-size:clamp(40px,12vw,84px);flex-wrap:wrap;gap:0 .3em;font-weight:800;line-height:1;display:flex;justify-content:center}
#wt span{display:inline-block;background:linear-gradient(120deg,#ff3d81,#ff8a3d,#ffd23d,#ff3d81);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(60px) rotate(12deg) scale(.5);animation:ltr .9s cubic-bezier(.2,1.4,.4,1) forwards,shine 4s linear infinite;transition:transform .25s}
#wt span:hover{transform:translateY(-12px) rotate(-6deg)}
@keyframes ltr{to{opacity:1;transform:none}}
@keyframes shine{to{background-position:300% 0}}
#wsub{height:28px;margin:18px 0 34px;color:#d0d0d0;font-size:18px;transition:opacity .4s,transform .4s}
#wsub.sw{opacity:0;transform:translateY(8px)}
.enter{position:relative;background:var(--g);color:#000;font-weight:700;font-size:18px;padding:16px 38px;border-radius:99px;animation:pulse 2s infinite;opacity:0;animation:pulse 2s infinite,fin .6s 1.4s forwards}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff3d8199}100%{box-shadow:0 0 0 26px #ff3d8100}}
@keyframes fin{to{opacity:1}}
.wf{margin-top:22px;color:var(--mu);font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<body>
<div id="welcome">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <canvas id="fx"></canvas>
  <div class="wc">
    <h1 id="wt" aria-label="BuzzME"></h1>
    <p id="wsub"></p>
    <button class="enter" data-a="enter">Se Connecter </button>
    <p class="wf">Touchez l’écran pour faire pleuvoir des surprises</p>
  </div>
</div>
<div id="app"></div>
<nav class="nav"><div id="nav"></div></nav>b
<div class="toast" id="toast"></div><div class="live" id="live"></div><div class="rib" id="rib"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RATE=2800;const money=n=>S&&S.fc?'≈'+Math.round(n*(S.rate||RATE)).toLocaleString('fr-FR')+' FC':'$'+(+n).toFixed(2).replace(/\.00$/,'');
const KEY='vitrine.v1';
function seed(){  
  const sh=[['Kivu Café','☕','Food',25],['Wax & Co','👗','Mode',330],['TechBox','📱','Tech',200],['Lola Douceurs','🍰','Food',340],['Glow Studio','🧴','Beauté',290]].map((a,i)=>({id:'s'+i,name:a[0],emoji:a[1],cat:a[2],hue:a[3]}));
  const pr=[[0,'Café arabica 500 g',12,'Torréfié chaque semaine, notes de cacao.','☕',25,214,481],[1,'Robe wax Ndombe',45,'Coupe droite, tissu 100 % coton.','👗',330,167,912],[2,'Écouteurs sans fil',29,'24 h d’autonomie, boîtier de charge.','🎧',200,298,655],[3,'Gâteau chocolat 8 parts',22,'Sur commande, livré le jour même.','🍰',340,143,1204],[4,'Sérum éclat visage',18,'Vitamine C, peau nette en 2 semaines.','🧴',290,189,733],[1,'Sandales cuir tressé',32,'Faites main, pointures 36 à 45.','👡',18,96,388],[2,'Coque iPhone antichoc',9,'Transparente, bords renforcés.','📱',215,251,297],[0,'Piment maison 250 ml',5,'Piquant, sans conservateur.','🌶️',5,178,402],[3,'Beignets mikate x12',6,'Chauds, sucrés, croustillants.','🍩',35,312,845],[4,'Huile de karité pure',11,'Corps et cheveux, 200 ml.','🥥',45,121,264]];
  const cm=[['Aïcha','Trop beau, je prends !'],['Patrick','Livraison possible à Gombe ?'],['Grâce','Je confirme, qualité au top 🔥']];
  return{shops:sh,me:null,cart:[],orders:[],products:pr.map((a,i)=>({id:'p'+i,shop:'s'+a[0],name:a[1],price:a[2],desc:a[3],emoji:a[4],hue:a[5],sold:a[6],likes:a[7],liked:false,t:100-i,img:'',comments:i%2?[cm[i%3]]:[cm[0],cm[2]]}))};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let view='role',cat='Tout',shopF=null,pend='',tab='prod';
const shopOf=id=>S.shops.find(s=>s.id===id)||{name:'?',emoji:'🛍️',hue:0,cat:''};
const prod=id=>S.products.find(p=>p.id===id);
const avatar=s=>`<i class="av" style="--h:${s.hue};${s.col?'background:'+s.col+'55':''}">${s.emoji}</i>`;
const vis=(p,c='')=>`<div class="vis ${c}" data-a="dbl" data-id="${p.id}" style="${p.img?`background-image:url(${p.img})`:`background:radial-gradient(circle at 30% 20%,hsl(${p.hue} 90% 55%),hsl(${(p.hue+50)%360} 80% 14%) 75%)`}">${p.img?'':`<span>${p.emoji}</span>`}</div>`;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const cartN=()=>S.cart.reduce((a,c)=>a+c.q,0);

function post(p){const s=shopOf(p.shop);
  return `<article class="post" style="--sc:${s.col||'#ff8a3d'}"><header>${avatar(s)}<div><b>${esc(s.name)}${s.ver?' <span class="vf">✔</span>':''}</b><small>${esc(s.cat)}${s.zone?' 📍'+esc(s.zone):''}${s.bio?' · '+esc(s.bio):''}${p.feat?' ⭐ À la une':''}${p.likes>800?' 🔥 Tendance':''}</small></div><span class="price">${money(p.price)}</span></header>${p.promo?`<div class="promo"><span>⚡ Promo flash <s class="mu">${money(p.old)}</s></span><b class="cd" data-end="${p.promo}"></b></div>`:''}${frame(p)}

  const it=S.cart.map(c=>({c,p:prod(c.id)})).filter(x=>x.p),tot=it.reduce((a,x)=>a+x.p.price*x.c.q,0);

  ${it.map(x=>`<div class="row">${vis(x.p)}<div class="i"><b>${esc(x.p.name)}</b><span class="mu">${money(x.p.price)} · ${esc(shopOf(x.p.shop).name)}</span></div><button class="mini" data-a="q-" data-id="${x.p.id}">−</button><b>${x.c.q}</b><button class="mini" data-a="q+" data-id="${x.p.id}">+</button></div>`).join('')||'<div class="empty"><b>🛒</b>Votre panier est vide. Retournez découvrir de belles choses.</div>'}
  ${it.length?`<div class="tot"><span>Total</span><span class="price" id="tt">${money(tot)}</span></div><div class="form"><input id="cn" placeholder="Votre nom" value="${esc((S.cl||{}).n||'')}"><input id="cp" type="tel" placeholder="Votre téléphone" value="${esc((S.cl||{}).p||'')}"><select id="lvs"><option value="moto" ${lv==='moto'?'selected':''}>🛵 Livraison moto (frais selon la boutique)</option><option value="retrait" ${lv==='retrait'?'selected':''}>🏬 Retrait en boutique</option></select><select id="pys"><option value="cash">💵 Paiement à la livraison</option><option value="momo">📱 Mobile Money</option></select><input id="nt" placeholder="Note pour le marchand (optionnel)"><div class="cin" style="padding:0"><input id="cpn" placeholder="Code promo (ex. BUZZ10)"><button data-a="cpn">Appliquer</button></div><span class="mu" id="ttn"></span></div><button class="go" data-a="order">Commander</button><button class="chip" style="margin:0 16px" data-a="vide">Vider le panier</button>`:''}
  ${myOffers()}${myFavs()}${mine.length?`<h2 class="h2">Mes commandes</h2>${mine.map(o=>`<div class="row"><div class="i"><b>${esc(shopOf(o.shop).name)} · ${money(o.total)}</b><span class="mu">${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</span></div><span class="badge">${['Envoyée','En préparation','Livrée'][o.st]}</span><button class="mini" data-a="reord" data-id="${o.id}" title="Recommander" aria-label="Recommander">↻</button>${shopOf(o.shop).wa?`<a class="mini" target="_blank" rel="noopener" href="${waLink(o)}">WhatsApp</a>`:''}</div>`).join('')}`:''}`}

function render(){
  $('#app').innerHTML=(S.maint&&S.role!=='admin'&&view!=='role'?mntV:({home,top:topSales,boutique,cart,role:roleV,admin:adminV}[view]||home))();if(view==='cart')updTot();document.body.dataset.r=view==='role'?'':(S.role||'client');document.body.dataset.ft=Object.keys(S.ft||{}).filter(k=>S.ft[k]===0).join(' ');$('#rib').textContent=view==='role'?'':({client:'🛍️ Espace Client',marchand:'🏪 Espace Commerçant',admin:'🛡️ Équipe BuzzME'}[S.role||'client']);

}
function heart(el){const h=document.createElement('div');h.className='hrt';h.textContent='♥';el.appendChild(h);setTimeout(()=>h.remove(),800)}
function like(id,el){const p=prod(id);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();
  document.querySelectorAll(`.lk[data-id="${id}"]`).forEach(b=>{b.classList.toggle('on',p.liked);b.textContent=p.liked?'♥':'♡'});
  document.querySelectorAll(`.lc[data-id="${id}"]`).forEach(b=>b.textContent=p.likes+' j’aime');
  if(p.liked&&el)heart(el)}
function addCart(id){const pp=prod(id);if(pp&&pp.stock===0)return toast('Produit épuisé');const c=S.cart.find(x=>x.id===id);c?c.q++:S.cart.push({id,q:1});save();toast('Ajouté au panier ✓');render()}
function readImg(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};i.src=r.result};r.readAsDataURL(f)}
const V=id=>($('#'+id)||{}).value||'';

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='enter')return enter();
  const g=AD[a];if(g){if(S.role!=='admin'||!RL[ar]||!RL[ar].p.includes(g))return toast('Action non autorisée pour votre rôle');lg(a,id)}
  if(a==='nav'){view=b.dataset.c;if(view!=='home')shopF=null;render();scrollTo(0,0)}
  else if(a==='cat'){cat=b.dataset.c;render()}
  else if(a==='shop'){shopF=shopF===id?null:id;render();scrollTo(0,0)}
  else if(a==='like')like(id,b.closest('.post').querySelector('.vis'));
  else if(a==='add')addCart(id);
  else if(a==='focus')$('#ci'+id).focus();
  else if(a==='cm')sendCm(id);
  else if(a==='q+'||a==='q-'){const c=S.cart.find(x=>x.id===id);c.q+=a==='q+'?1:-1;if(c.q<1)S.cart=S.cart.filter(x=>x!==c);save();render()}
  else if(a==='tab'){tab=b.dataset.c;render()}
  else if(a==='cur'){S.fc=!S.fc;save();render()}
  else if(a==='dbl'){clearTimeout(tc);tc=setTimeout(()=>openQ(id),260)}
  else if(a==='quick')openQ(id);
  else if(a==='close'){const q=$('#qv');if(q)q.remove()}
  else if(a==='role'){const c=b.dataset.c;if(c==='admin'){gate=true;render();return}gate=false;S.role=c;view=c==='marchand'?'boutique':'home';save();render();scrollTo(0,0)}
  else if(a==='login'){const k=V('ar');if(V('ap')===S.pins[k]){ar=k;S.role='admin';gate=false;view='admin';at='dash';save();render()}else toast('Code incorrect')}
  else if(a==='atab'){at=b.dataset.c;render()}
  else if(a==='ver'){const s=S.shops.find(x=>x.id===id);s.ver=!s.ver;save();render()}
  else if(a==='sus'){const s=S.shops.find(x=>x.id===id);s.sus=!s.sus;save();render()}
  else if(a==='clr'){prod(id).comments=[];save();render()}
  else if(a==='feat'){const p=prod(id);p.feat=!p.feat;save();render()}
  else if(a==='setban'){S.ban=V('bn').trim();save();toast('Bandeau publié 📣');render()}
  else if(a==='setpin'){const k=b.dataset.c,v=V('pn'+k).trim();if(v.length<4)return toast('4 chiffres minimum');S.pins[k]=v;save();toast('Code changé ✓')}
  else if(a==='dsh'){if(armed!==id){armed=id;return toast('Touchez encore pour supprimer')}armed='';S.shops=S.shops.filter(x=>x.id!==id);S.products=S.products.filter(p=>p.shop!==id);S.cart=S.cart.filter(c=>prod(c.id));if(S.me===id)S.me=null;save();render()}
  else if(a==='hid'){const p=prod(id);p.hid=!p.hid;save();render()}
  else if(a==='cdel'){prod(id).comments.splice(+b.dataset.n,1);save();render()}
  else if(a==='mdel'){S.msgs.splice(+id,1);save();render()}
  else if(a==='dord'){S.orders=S.orders.filter(o=>o.id!==id);save();render()}
  else if(a==='addcode'){const c=V('nc').trim().toUpperCase(),p=parseInt(V('np'));if(!c||!(p>0&&p<=90))return toast('Code et % (1 à 90) requis');(S.codes=S.codes||[]).push({c,p,on:true});save();render()}
  else if(a==='togcode'){S.codes[+id].on=!S.codes[+id].on;save();render()}
  else if(a==='delcode'){S.codes.splice(+id,1);save();render()}
  else if(a==='setcom'){S.com=Math.max(0,parseFloat(V('cm'))||0);save();toast('Commission enregistrée ✓');render()}
  else if(a==='tgl'){S.ft=S.ft||{};const k=b.dataset.c;S.ft[k]=S.ft[k]===0?1:0;save();render()}
  else if(a==='maint'){S.maint=!S.maint;save();render()}
  else if(a==='setrate'){const r=parseFloat(V('rt')),d=parseFloat(V('df'));if(r>0)S.rate=r;if(d>=0)S.dfee=d;save();toast('Réglages enregistrés ✓');render()}
  else if(a==='rst'){if(armed!=='rst'){armed='rst';return toast('Touchez encore : toutes les données seront effacées')}try{localStorage.removeItem(KEY)}catch(x){}location.reload()}
  else if(a==='vide'){S.cart=[];save();render()}
  else if(a==='reord'){const o=S.orders.find(x=>x.id===id);o.items.forEach(i=>{if(prod(i.id)){const c=S.cart.find(x=>x.id===i.id);c?c.q+=i.q:S.cart.push({id:i.id,q:i.q})}});save();toast('Articles remis au panier ↻');render()}
  else if(a==='flash')openFl(id);
  else if(a==='pflash'){const t=V('fx').trim();if(!t&&!pf)return toast('Écrivez un flash');(S.fl=S.fl||[]).push({id:'fl'+Date.now(),shop:S.me,txt:t,img:pf,t:Date.now()});pf='';save();toast('Flash publié ⚡ Visible 24 h dans la vitrine');cat='Tout';shopF=null;view='home';scrollTo(0,0);render()}
  else if(a==='dfl'){S.fl=S.fl.filter(x=>x.id!==id);save();render()}
  else if(a==='chat')openChat(id);
  else if(a==='smsg'){const c=b.dataset.c,t=(c==='c'?V('cm1'):V('cm2')).trim();if(!t)return;(S.msgs=S.msgs||[]).push({shop:c==='c'?chatS:S.me,f:c,x:t,t:Date.now()});save();if(c==='c')openChat(chatS);else render()}
  else if(a==='fol'){S.fol=S.fol||[];S.fol=S.fol.includes(id)?S.fol.filter(x=>x!==id):[...S.fol,id];save();openChat(id)}
  else if(a==='pause'){const m=shopOf(S.me);m.pause=!m.pause;save();toast(m.pause?'Boutique en pause ⏸':'Boutique réactivée ✓');render()}
  else if(a==='stk'){prod(id).stock+=5;save();render()}
  else if(a==='cpn'){cp=V('cpn').trim().toUpperCase();if(!cd()){cp='';toast('Code invalide ou expiré')}else toast('Code appliqué ✓');updTot()}
  else if(a==='offer'){const e=$('#of'+id);e.hidden=!e.hidden}
  else if(a==='sendoff'){const pr=parseFloat(V('op'+id)),ph=V('oq'+id).trim();if(!(pr>0)||!ph)return toast('Indiquez votre prix et votre téléphone');const p=prod(id);(S.offers=S.offers||[]).push({id:'f'+Date.now(),p:id,shop:p.shop,price:pr,phone:ph,st:0,mine:true});save();toast('Offre envoyée 🤝');render()}
  else if(a==='oacc'){const o=S.offers.find(x=>x.id===id),p=prod(o.p);o.st=1;if(p)p.sold++;S.orders.push({id:'o'+Date.now(),shop:o.shop,items:[{n:p?p.name:'Produit',q:1,p:o.price,id:o.p}],total:o.price,client:o.phone,phone:o.phone,st:0,mine:o.mine});save();toast('Offre acceptée ✓');ka();render()}
  else if(a==='orej'){S.offers.find(x=>x.id===id).st=2;save();render()}
  else if(a==='savestyle'){const m=shopOf(S.me);m.col=V('sc2');m.bio=V('sb').trim();m.zone=V('sz').trim();m.fee=parseFloat(V('sf'));if(isNaN(m.fee))m.fee=2;save();toast('Style enregistré ✨');render()}
  else if(a==='setwa'){shopOf(S.me).wa=V('sw2').replace(/\D/g,'');save();toast('WhatsApp enregistré ✓');render()}
  else if(a==='promo'){const p=prod(id);p.old=p.price;p.price=Math.round(p.price*80)/100;p.promo=Date.now()+7200000;save();toast('Promo flash lancée ⚡');confetti();render()}
  else if(a==='rate'){const p=prod(id),n=+b.dataset.n;p.rs=p.rs||0;p.rn=p.rn||0;if(p.my)p.rs+=n-p.my;else{p.rs+=n;p.rn++}p.my=n;save();toast('Merci pour votre note ★');render()}

function modV(){let h='';S.products.forEach(p=>p.comments.forEach((c,i)=>{h+=`<div class='row'><div class='i'><b>${esc(c[0])} sur ${esc(p.name)}</b><span class='mu'>${esc(c[1])}${c[2]?' 📷':''}</span></div><button class='mini' data-a='cdel' data-id='${p.id}' data-n='${i}'>Supprimer</button></div>`}));const m=(S.msgs||[]).map((x,i)=>`<div class='row'><div class='i'><b>${esc(shopOf(x.shop).name)} (${x.f==='c'?'client':'marchand'})</b><span class='mu'>${esc(x.x)}</span></div><button class='mini' data-a='mdel' data-id='${i}'>Supprimer</button></div>`).join('');return `<h2 class='h2'>Avis et commentaires</h2>${h||"<div class='empty'>Rien à modérer.</div>"}<h2 class='h2'>Messages</h2>${m||"<div class='empty'>Aucun message.</div>"}`}
function mktExtra(){return `<div class='form'><h2>Codes promo</h2>${(S.codes||[]).map((c,i)=>`<div class='row' style='margin:0'><div class='i'><b>${esc(c.c)}</b><span class='mu'>-${c.p} % · ${c.on?'Actif':'Désactivé'}</span></div><button class='mini' data-a='togcode' data-id='${i}'>${c.on?'Pause':'Activer'}</button><button class='mini' data-a='delcode' data-id='${i}'>✕</button></div>`).join('')}<input id='nc' maxlength='12' placeholder='Nouveau code (ex. WEEKEND)'><input id='np' type='number' min='1' max='90' placeholder='Réduction en %'><button class='go' style='margin:0;width:100%' data-a='addcode'>Créer le code</button></div>`}
function finV(){const c=S.com??5,rows=S.shops.map(s=>{const os=S.orders.filter(o=>o.shop===s.id);return[s,os.length,os.reduce((a,o)=>a+o.total,0)]}),tv=rows.reduce((a,r)=>a+r[2],0),csv='boutique,commandes,volume,commission\n'+rows.map(r=>[r[0].name,r[1],r[2].toFixed(2),(r[2]*c/100).toFixed(2)].join(',')).join('\n');return `<div class='stats'><div><b>${money(tv)}</b><span>Volume total</span></div><div><b>${money(tv*c/100)}</b><span>Commission BuzzME (${c} %)</span></div></div><div class='form'><label>Commission par vente (%)</label><input id='cm' type='number' min='0' step='0.5' value='${c}'><button class='chip' data-a='setcom'>Enregistrer</button></div>${rows.map(r=>`<div class='row'><div class='i'><b>${esc(r[0].name)}</b><span class='mu'>${r[1]} commande(s) · ${money(r[2])}</span></div><b>${money(r[2]*c/100)}</b></div>`).join('')}<div class='form'><label>Export CSV (copier-coller)</label><textarea rows='5' readonly>${esc(csv)}</textarea></div>`}
function setV(){const f=S.ft||{},on=k=>f[k]!==0,tg=(k,l)=>`<div class='row' style='margin:0'><div class='i'><b>${l}</b></div><button class='mini' data-a='tgl' data-c='${k}'>${on(k)?'Actif ✓':'Désactivé'}</button></div>`;return `<div class='form'><h2>Fonctionnalités</h2>${tg('offers','🤝 Offres et marchandage')}${tg('chat','💬 Messagerie')}${tg('flash','⚡ Flash')}<div class='row' style='margin:0'><div class='i'><b>🛠️ Mode maintenance</b><span class='mu'>Bloque clients et marchands</span></div><button class='mini' data-a='maint'>${S.maint?'Actif · Désactiver':'Activer'}</button></div></div><div class='form'><h2>Paramètres généraux</h2><label>1 $ = combien de FC ?</label><input id='rt' type='number' value='${S.rate||RATE}'><label>Frais de livraison par défaut ($)</label><input id='df' type='number' step='0.5' value='${S.dfee??2}'><button class='go' style='margin:0;width:100%' data-a='setrate'>Enregistrer</button></div><div class='form'><h2>Zone sensible</h2><button class='chip' data-a='rst'>Réinitialiser toutes les données</button></div>`}
function logV(){return (S.log||[]).map(l=>`<div class='row'><div class='i'><b>${esc(l.x)}</b><span class='mu'>${esc(l.w)} · ${new Date(l.t).toLocaleString('fr-FR')}</span></div></div>`).join('')||"<div class='empty'><b>📜</b>Aucune action enregistrée.</div>"}
function permsV(){return `<div class='form'><h2>Qui peut faire quoi</h2>${Object.keys(RL).map(k=>`<div><b>${RL[k].n}</b><br><span class='mu'>${RL[k].p.map(x=>TB[x]).join(' · ')}</span></div>`).join('')}</div>`}
function updTot(){const e=$('#tt');if(!e)return;let sub=0;const sh=new Set();S.cart.forEach(c=>{const p=prod(c.id);if(p){sub+=p.price*c.q;sh.add(p.shop)}});const d=cd(),fee=lv==='moto'?[...sh].reduce((a,x)=>a+(shopOf(x).fee??(S.dfee??2)),0):0;e.textContent=money(sub*(1-d)+fee);const n=$('#ttn');if(n)n.textContent=(d?'Remise -'+Math.round(d*100)+' % · ':'')+(fee?'Livraison '+money(fee):'Retrait gratuit')}
function waLink(o){return 'https://wa.me/'+shopOf(o.shop).wa+'?text='+encodeURIComponent('Bonjour, commande BuzzME de '+o.client+' :\n'+o.items.map(i=>i.q+'× '+i.n).join('\n')+'\nTotal : $'+o.total)}

/* Bienvenue */
const wt=$('#wt');let li=0;'Soyez le bienvenu'.split(' ').forEach(w=>{const g=document.createElement('div');g.style.display='flex';w.split('').forEach(l=>{const s=document.createElement('span');s.textContent=l;s.style.animationDelay=(.15+li++*.07)+'s,0s';g.appendChild(s)});wt.appendChild(g)});
const tags=['Ouvrez votre boutique en une minute','Découvrez ce qui se vend près de vous','Vendez, partagez, faites briller vos produits'];let ti=0;
$('#wsub').textContent=tags[0];
const tm=setInterval(()=>{const w=$('#wsub');w.classList.add('sw');setTimeout(()=>{ti=(ti+1)%tags.length;w.textContent=tags[ti];w.classList.remove('sw')},400)},2600);
let alive=true;
(function(){const c=$('#fx'),x=c.getContext('2d'),E=['🛍️','👗','☕','📱','🍰','👟','💎','🎧','🌶️','🧴','🎁','💄'];let W,H,P=[],m={x:-999,y:-999};
  const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
  const mk=(px,py,b)=>({x:px==null?Math.random()*W:px,y:py==null?H+40:py,s:18+Math.random()*30,v:.3+Math.random()*.7,e:'🔥',k:Math.random()<.2,p:Math.random()*6,vx:b?(Math.random()-.5)*9:0,vy:b?-Math.random()*9-2:0,b});
  for(let i=0;i<64;i++)P.push(mk(null,Math.random()*H));
  const burst=e=>{if(e.target.closest('button'))return;for(let i=0;i<14;i++)P.push(mk(e.clientX,e.clientY,1))};
  $('#welcome').addEventListener('pointerdown',burst);
  $('#welcome').addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY;$('.wc').style.transform=`perspective(800px) rotateY(${(e.clientX/innerWidth-.5)*16}deg) rotateX(${(.5-e.clientY/innerHeight)*16}deg)`});
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  (function loop(){if(!alive)return;x.clearRect(0,0,W,H);const t=Date.now()/900;
    P.forEach(q=>{q.x+=Math.sin(t+q.p)*.5+q.vx;q.y-=q.v+q.vy*(q.b?1:0);
      if(q.b){q.vy+=.28;q.vx*=.98}
      const dx=q.x-m.x,dy=q.y-m.y,d=Math.hypot(dx,dy);if(d<130){q.x+=dx/d*4;q.y+=dy/d*4}
      if(q.b||q.k){x.globalAlpha=q.b?.95:.85;x.font=(q.b?q.s:22)+'px serif';x.fillText(q.e,q.x,q.y)}else{x.globalAlpha=.9;x.fillStyle='#ff8a3d';x.beginPath();x.arc(q.x,q.y,2.2,0,6.3);x.fill()}});
    x.lineWidth=1;x.strokeStyle='#ff8a3d';for(let i=0;i<P.length;i++){const a=P[i];if(a.b)continue;for(let j=i+1;j<P.length;j++){const b=P[j];if(b.b)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<140){x.globalAlpha=(1-d/140)*.55;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}}
    P=P.filter(q=>q.b?q.y<H+60:true);P.forEach(q=>{if(!q.b&&q.y<-50){q.y=H+40;q.x=Math.random()*W}});
    requestAnimationFrame(loop)})();
})();
function enter(){const w=$('#welcome');w.classList.add('out');clearInterval(tm);setTimeout(()=>{alive=false;w.remove()},950)}
document.addEventListener('pointermove',e=>{const v=e.target.closest&&e.target.closest('.post .vis');if(!v)return;const r=v.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;v.style.setProperty('--rx',(x-.5)*34);v.style.setProperty('--ry',(y-.5)*34);v.style.setProperty('--gx',x*100+'%');v.style.setProperty('--gy',y*100+'%')});
document.addEventListener('input',e=>{if(e.target.id==='q'){const q=e.target.value.toLowerCase();document.querySelectorAll('.post').forEach(p=>p.style.display=p.textContent.toLowerCase().includes(q)?'':'none')}});
function confetti(){ka();for(let i=0;i<40;i++){const d=document.createElement('i');d.textContent=['🎉','✨','💖','🛍️','⭐'][i%5];d.style.cssText=`position:fixed;left:${Math.random()*100}vw;top:-30px;font-size:${16+Math.random()*20}px;z-index:30;pointer-events:none;transition:transform ${1.6+Math.random()*1.4}s cubic-bezier(.2,.6,.4,1),opacity 2.5s`;document.body.appendChild(d);requestAnimationFrame(()=>{d.style.transform=`translate(${(Math.random()-.5)*200}px,${innerHeight+60}px) rotate(${Math.random()*720}deg)`;d.style.opacity=0});setTimeout(()=>d.remove(),3200)}}
const NM=['Aïcha','Patrick','Grâce','Jonathan','Mireille','Dieumerci'];
setInterval(()=>{if(alive||!S.products.length)return;const p=S.products[Math.random()*S.products.length|0],l=$('#live');l.textContent='🔥 '+NM[Math.random()*NM.length|0]+' vient d’acheter '+p.name;l.classList.add('show');setTimeout(()=>l.classList.remove('show'),3200)},9000);
const GEN=[['Montre minimaliste',38,'Cadran noir, bracelet cuir.','⌚',210],['Sac à dos urbain',34,'Étanche, port USB intégré.','🎒',260],['Lunettes de soleil',15,'Verres polarisés, monture légère.','🕶️',40],['Baskets blanches',55,'Confort toute la journée.','👟',190],['Parfum ambré 50 ml',42,'Sillage chaud et boisé.','🧴',20],['Enceinte Bluetooth',27,'Basses profondes, 12 h d’autonomie.','🔊',230],['Bouquet de roses',25,'Livré en 2 h, carte offerte.','💐',340],['Casque gaming',48,'Micro antibruit, son 7.1.','🎮',270],['Pizza maison',10,'Pâte fine, cuite au feu de bois.','🍕',15],['Chapeau de paille',14,'Léger, parfait pour le soleil.','👒',45],['Bracelet doré',19,'Plaqué or, ajustable.','💎',50],['Jus de bissap 1 L',4,'Frais, sans colorant.','🍹',350]];
function gen(sid,n){const ids=S.shops.map(s=>s.id),pool=GEN.filter(g=>!S.products.some(p=>p.name===g[0])).sort(()=>Math.random()-.5).slice(0,n);pool.forEach((g,i)=>S.products.push({id:'g'+Date.now()+i+Math.random().toString(36).slice(2,5),shop:sid||ids[Math.random()*ids.length|0],name:g[0],price:g[1],desc:g[2],emoji:g[3],hue:g[4],sold:sid?0:Math.random()*150|0,likes:sid?0:Math.random()*400|0,liked:false,t:Date.now()+i,img:'',comments:[]}))}
if(!S.v2){S.v2=1;gen(null,6);save()}
if(!S.v3){S.v3=1;S.products.forEach((p,i)=>{if(p.rn==null){p.rn=p.sold?6+Math.random()*50|0:0;p.rs=Math.round(p.rn*(3.9+Math.random()*1))}if(i===2||i===3){p.old=p.price;p.price=Math.round(p.price*75)/100;p.promo=Date.now()+5400000}});save()}
setInterval(()=>{const now=Date.now();let ex=false;S.products.forEach(p=>{if(p.promo&&p.promo<now){p.price=p.old;delete p.promo;ex=true}});if(ex){save();render()}document.querySelectorAll('.cd').forEach(e=>{const s=Math.max(0,(+e.dataset.end-now)/1000|0);e.textContent=[s/3600|0,s/60%60|0,s%60].map(v=>String(v).padStart(2,'0')).join(':')})},1000);
render();
