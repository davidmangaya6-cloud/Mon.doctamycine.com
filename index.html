<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocSecur Pro - Fix A4 & Cachet</title>

    <!-- PONT NATIF POUR L'APK (Injecté automatiquement par le robot) -->
    <script src="capacitor.js"></script>

    <!-- BIBLIOTHÈQUES LOCALES HORS-LIGNE -->
    <script src="js/qrcode.min.js"></script>
    <script src="js/html2pdf.bundle.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #020617; color: #f8fafc; min-height: 100vh; padding-bottom: 20px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 1024px) { .container { grid-template-columns: 1fr 1.1fr; } }

        /* EN-TÊTE APP */
        header { background-color: #0f172a; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 50; padding: 12px 16px; }
        .header-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo-title { font-weight: 900; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo-title span { color: #38bdf8; font-weight: 400; }
        
        /* CARTES ET FORMULAIRES */
        .card { background-color: #0f172a; border: 2px solid #1e293b; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
        .card-header { border-bottom: 2px solid #1e293b; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 0.85rem; font-weight: 900; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; margin-bottom: 4px; }
        input, select, textarea { width: 100%; background-color: #020617; border: 2px solid #1e293b; color: #fff; font-weight: 700; border-radius: 10px; padding: 10px; font-size: 0.85rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #0284c7; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        /* BOUTONS */
        .btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 0.8rem; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-primary { background-color: #0284c7; color: white; width: 100%; }
        .btn-primary:hover { background-color: #0369a1; }
        .btn-dark { background-color: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
        .btn-dark:hover { background-color: #334155; }
        .btn-success { background-color: #059669; color: white; }
        .btn-danger { background-color: #ef4444; color: white; padding: 4px 8px; font-size: 0.7rem; }
        .btn-warning { background-color: #f59e0b; color: white; padding: 4px 8px; font-size: 0.7rem; }
        .btn-chip { background-color: #1e293b; color: #38bdf8; padding: 4px 8px; font-size: 0.65rem; border: 1px solid #0284c7; border-radius: 6px; cursor: pointer; }

        /* FEUILLE A4 DE RENDU */
        #ordonnanceDoc {
            width: 210mm;
            height: 296mm;
            background-color: #ffffff;
            color: #0f172a;
            padding: 10mm 12mm;
            margin: 0 auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        .doc-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #1e3a8a; padding-bottom: 8px; }
        .doc-logo { width: 50px; height: 50px; border: 2px solid #cbd5e1; border-radius: 8px; padding: 2px; object-fit: contain; }
        .doc-doctor-info h3 { font-size: 1.05rem; font-weight: 900; color: #1e3a8a; text-transform: uppercase; }
        .doc-doctor-info p { font-size: 0.72rem; color: #475569; }

        .doc-badge-date { background-color: #f0f9ff; border: 2px solid #bae6fd; padding: 6px 10px; border-radius: 8px; text-align: right; }

        .section-divider { border-top: 2px solid #1e3a8a; margin: 8px 0; position: relative; text-align: center; }
        .section-divider span { position: relative; top: -9px; background: white; padding: 0 10px; font-size: 0.65rem; font-weight: 900; color: #1e3a8a; text-transform: uppercase; }

        .patient-box { background-color: #f8fafc; border: 2px solid #cbd5e1; border-radius: 8px; padding: 8px 12px; display: flex; justify-content: space-between; margin-bottom: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 4px; border-radius: 6px; overflow: hidden; border: 2px solid #cbd5e1; }
        th { background-color: #1e3a8a; color: white; font-size: 0.68rem; text-transform: uppercase; padding: 6px; text-align: left; }
        td { font-size: 0.72rem; padding: 6px; border-bottom: 1px solid #e2e8f0; color: #0f172a; }

        .results-box { background-color: #f0f9ff; border: 2px solid #7dd3fc; border-radius: 8px; padding: 8px; margin-top: 8px; }
        .results-header { font-size: 0.68rem; font-weight: 900; color: #0369a1; text-transform: uppercase; border-bottom: 1px solid #bae6fd; padding-bottom: 3px; margin-bottom: 4px; }

        .doc-footer { 
            border-top: 2px solid #1e3a8a; 
            padding-top: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-top: auto; 
        }

        /* TAMPON ET CACHET MÉDICAL AU STYLE OFFICIEL */
        .stamp-box {
            width: 140px;
            height: 75px;
            border: 2px dashed #94a3b8;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #fafafa;
        }

        .digital-cachet {
            width: 70px;
            height: 70px;
            border: 2px double #1d4ed8;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #1d4ed8;
            padding: 2px;
            transform: rotate(-8deg);
            opacity: 0.85;
            font-size: 0.42rem;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .img-cachet {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform: rotate(-5deg);
        }

        /* CONFIGURATION D'IMPRESSION ET PDF */
        @page {
            size: A4 portrait;
            margin: 0;
        }
        @media print {
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .no-print { display: none !important; }
            .container { display: block !important; padding: 0 !important; margin: 0 !important; width: 100% !important; }
            #ordonnanceDoc { 
                box-shadow: none !important; 
                margin: 0 !important; 
                width: 210mm !important; 
                height: 297mm !important; 
                padding: 10mm 12mm !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>
