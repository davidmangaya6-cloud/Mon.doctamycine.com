name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Configurer Java (requis pour Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installer les dépendances
      run: npm install

    - name: Initialiser le projet Android Capacitor
      run: |
        npx cap android add || echo "Déjà ajouté"
        npx cap sync

    - name: Compiler l'APK avec Gradle
      run: |
        cd android && ./gradlew assembleDebug

    - name: Télécharger l'APK final
      uses: actions/upload-artifact@v4
      with:
        name: Mon-APK-Gratuite
        path: android/app/build/outputs/apk/debug/app-debug.apk
