name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurer Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installer les dépendances du projet
      run: npm install

    - name: Installer les plugins natifs Capacitor
      run: npm install @capacitor/filesystem @capacitor/share --legacy-peer-deps

    - name: Automatisation et Injection Native
      run: |
        mkdir -p www
        cp -r * www/ 2>/dev/null || true
        # Injection automatique de capacitor.js dans le HEAD sans casser votre fichier
        sed -i 's|<head>|<head><script src="capacitor.js"></script>|g' www/index.html

    - name: Ajouter la plateforme Android
      run: npx cap add android

    - name: Synchroniser le projet
      run: npx cap sync

    - name: Compiler l'APK avec Gradle
      run: |
        cd android
        ./gradlew clean
        ./gradlew assembleDebug --refresh-dependencies

    - name: Télécharger l'APK final
      uses: actions/upload-artifact@v4
