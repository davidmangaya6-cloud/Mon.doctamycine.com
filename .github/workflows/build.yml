name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurer Java (requis pour Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Installer les dépendances
      run: npm install

    - name: Créer un dossier web temporaire
      run: mkdir -p www && echo "<h1>Mon App</h1>" > www/index.html

    - name: Ajouter la plateforme Android
      run: npx cap add android

    - name: Synchroniser le projet
      run: npx cap sync

    - name: Compiler l'APK avec Gradle
      run: |
        cd android && ./gradlew assembleDebug

    - name: Télécharger l'APK final
      uses: actions/upload-artifact@v4
      with:
        name: Mon-APK-Gratuite
        path: android/app/build/outputs/apk/debug/app-debug.apk
