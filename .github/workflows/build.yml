name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Configurer Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Installer les dépendances du projet
      run: npm install --legacy-peer-deps

    - name: Installer les plugins natifs (même version majeure que Capacitor)
      run: |
        MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
        echo "Capacitor core majeur : $MAJOR"
        npm install @capacitor/filesystem@$MAJOR @capacitor/share@$MAJOR --legacy-peer-deps

    - name: Préparer le dossier web (www)
      run: |
        rm -rf www
        mkdir www
        rsync -a \
          --exclude node_modules --exclude android --exclude ios \
          --exclude www --exclude .git --exclude .github \
          --exclude package.json --exclude package-lock.json \
          --exclude icon-only.png --exclude splash.png --exclude splash-dark.png --exclude assets \
          ./ www/
        # Corrige la casse : JS -> js (Android est sensible aux majuscules)
        if [ -d www/JS ] && [ ! -d www/js ]; then mv www/JS www/js; fi
        if [ ! -f www/index.html ]; then cp Claudia_.html www/index.html; fi
        echo "--- contenu de www ---"
        ls -la www
        echo "--- contenu de www/js ---"
        ls -la www/js || true

    - name: Installer html2pdf depuis npm
      run: |
        npm install html2pdf.js@0.10.3 --no-save --legacy-peer-deps
        mkdir -p www/js
        cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/js/html2pdf.bundle.min.js
        echo "--- contenu de www/js ---"
        ls -la www/js

    - name: Vérifier la config Capacitor
      run: |
        cat capacitor.config.* || true

    - name: Ajouter la plateforme Android
      run: |
        if [ ! -d android ]; then npx cap add android; fi

    - name: Générer l'icône et l'écran de démarrage
      run: |
        if [ -f icon-only.png ] && [ -f splash.png ]; then
          mkdir -p assets
          cp icon-only.png splash.png assets/
          if [ -f splash-dark.png ]; then cp splash-dark.png assets/; fi
          npx --yes @capacitor/assets generate --android
        else
          echo "Pas d'icône trouvée : étape ignorée"
        fi

    - name: Synchroniser le projet
      run: |
        npx cap sync android
        echo "--- plugins détectés ---"
        npx cap ls android

    - name: Compiler l'APK avec Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Télécharger l'APK final
      uses: actions/upload-artifact@v4
      with:
        name: Ordonnance-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    # ================= PLAY STORE =================
    # Ces étapes ne s'exécutent que si la clé de signature est configurée
    # dans GitHub (Settings > Secrets and variables > Actions).
    # Sans clé, tout ce qui est ci-dessus fonctionne comme avant.

    - name: Play Store - vérifier la clé de signature
      id: cle
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
          echo "pret=true" >> "$GITHUB_OUTPUT"
          echo "Clé de signature trouvée : le bundle Play Store sera fabriqué."
        else
          echo "pret=false" >> "$GITHUB_OUTPUT"
          echo "Clé de signature non configurée : étapes Play Store ignorées (l'APK de test est produite normalement)."
        fi

    - name: Play Store - numéro de version
      if: steps.cle.outputs.pret == 'true'
      run: |
        CODE=$(( $(date +%s) / 60 ))
        NAME="1.0.${{ github.run_number }}"
        FILE=android/app/build.gradle
        sed -i -E "s/versionCode[[:space:]]*=?[[:space:]]*[0-9]+/versionCode = $CODE/" "$FILE"
        sed -i -E "s/versionName[[:space:]]*=?[[:space:]]*\"[^\"]*\"/versionName = \"$NAME\"/" "$FILE"
        grep -n -E "applicationId|versionCode|versionName" "$FILE"
        grep -q "versionCode = $CODE" "$FILE" || { echo "ERREUR : impossible de régler versionCode dans $FILE"; exit 1; }

    - name: Play Store - compiler le bundle (AAB)
      if: steps.cle.outputs.pret == 'true'
      run: |
        cd android
        ./gradlew bundleRelease

    - name: Play Store - signer le bundle
      if: steps.cle.outputs.pret == 'true'
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        AAB=android/app/build/outputs/bundle/release/app-release.aab
        test -f "$AAB" || { echo "ERREUR : bundle introuvable ($AAB)"; exit 1; }
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        jarsigner -keystore "$RUNNER_TEMP/upload-keystore.jks" \
          -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
          -sigalg SHA256withRSA -digestalg SHA-256 \
          "$AAB" upload
        jarsigner -verify "$AAB" | tail -n 2
        rm -f "$RUNNER_TEMP/upload-keystore.jks"

    - name: Play Store - récupérer le bundle signé
      if: steps.cle.outputs.pret == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: DOCTAMYCINE-Play-Store-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab
